<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YspCoder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; }
    picture, img { display: block; width: 100%; }
    img { image-rendering: pixelated; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; }
      .light { display: none; }
      .dark { display: block; }
    }
  </style>
</head>
<body>
  <picture class="light">
    <source media="(max-width: 640px)" srcset="../assets/player-light-mobile.png">
    <img src="../assets/player-light.png" alt="YspCoder player profile">
  </picture>
  <picture class="dark">
    <source media="(max-width: 640px)" srcset="../assets/player-dark-mobile.png">
    <img src="../assets/player-dark.png" alt="YspCoder player profile">
  </picture>
</body>
</html>
